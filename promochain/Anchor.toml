[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
promochain = "Ftsgw55ApGkXv6jFnCT5kHKuGFeYE7fcHZ6VF1bg6TsT"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[global]
# This setting is usually fine by default, but ensure it points to your types dir
idl_build = "target/idl"